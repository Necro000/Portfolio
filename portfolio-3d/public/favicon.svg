<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14112e" />
      <stop offset="70%" stop-color="#0b0818" />
      <stop offset="100%" stop-color="#07060d" />
    </radialGradient>

    <!-- Electric Blue Mana Gradient -->
    <linearGradient id="cyanMana" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#3ab7ff" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Outer Ring Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Base Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="#3ab7ff" stroke-width="2" filter="url(#glow)" />

  <!-- Inner Tech Compass Ticks -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#6d28d9" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Stylized Solo Leveling Hunter Blade / "A" Monogram -->
  <!-- Blade Point -->
  <polygon points="32,8 37,28 32,24 27,28" fill="url(#cyanMana)" filter="url(#glow)" />
  <!-- Blade Crossguard / "A" Crossbar -->
  <polygon points="18,34 32,30 46,34 32,32" fill="#3ab7ff" />
  <!-- Dagger Hilt & Pommel -->
  <rect x="30.5" y="32" width="3" height="18" rx="1.5" fill="#e9e7f5" />
  <circle cx="32" cy="52" r="2.5" fill="#3ab7ff" />

  <!-- Left & Right Mana Rune Wings ("A" Shape) -->
  <path d="M22 42 L27 28 L32 24 L25 46 Z" fill="url(#cyanMana)" opacity="0.85" />
  <path d="M42 42 L37 28 L32 24 L39 46 Z" fill="url(#cyanMana)" opacity="0.85" />
</svg>